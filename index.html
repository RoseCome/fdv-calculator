<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空投收益测算器</title><style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#222}h1{font-size:22px}label{display:block;margin:12px 0 4px}input,select{width:100%;padding:8px;font-size:16px}button{margin-top:16px;padding:10px 18px;font-size:16px;cursor:pointer}.out{margin-top:20px;padding:16px;background:#f6f6f6;border-radius:8px;font-size:18px;line-height:1.8}.note{color:#666;font-size:13px;margin-top:16px;line-height:1.6}</style></head><body><h1>空投收益测算器</h1><p>公式：单号预估 = FDV × 空投总池比例 ÷ 去女巫后净活跃地址数 × 权重</p><label>FDV（美元，百万）<input id="fdv" type="number" value="1500"></label><label>空投总池比例（%）<input id="pool" type="number" value="8" step="0.1"></label><label>净活跃地址数<input id="addr" type="number" value="80000"></label><label>权重<select id="w"><option value="1">基础合格 1.0x</option><option value="1.5" selected>深度活跃 1.5x</option><option value="2.5">核心贡献 2.5x</option></select></label><label>账号数量<select id="n"><option>1</option><option>2</option><option>3</option><option>5</option><option selected>10</option></select></label><button onclick="calc()">算一下</button><div class="out" id="out">点“算一下”出结果</div><p class="note">默认示例：FDV $1500M × 8% ÷ 8万地址 × 1.5x = 单号 $2,250，约 ¥16,290（汇率 7.24）。仅作投研参考，盘前价常虚高，积分类尤其不准；没有可信 FDV / 池比例 / 地址数时写“待定”，不编数字。赛道参考：顶级公链 2000M·10%、DePIN挂机 1000M·10%、去中心化AI 800M·12%、BTC二层 1200M·7%。</p><script>function calc(){const f=+document.getElementById('fdv').value*1e6,p=+document.getElementById('pool').value/100,a=+document.getElementById('addr').value,w=+document.getElementById('w').value,n=+document.getElementById('n').value;if(!f||!p||!a){document.getElementById('out').textContent='待定：缺 FDV / 池比例 / 地址数';return}const s=f*p/a*w;document.getElementById('out').innerHTML='单号预估：$'+s.toLocaleString(undefined,{maximumFractionDigits:0})+'（约 ¥'+Math.round(s*7.24).toLocaleString()+'）<br>'+n+' 个账号总产出：$'+(s*n).toLocaleString(undefined,{maximumFractionDigits:0})+'（约 ¥'+Math.round(s*n*7.24).toLocaleString()+'）';}calc();</script></body></html>
